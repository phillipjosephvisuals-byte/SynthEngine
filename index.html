<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYNTHWAVE STUDIO 84 // Workstation v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0813;
      --panel-bg: #140d24;
      --panel-border: #2a1b4e;
      --neon-pink: #ff2a85;
      --neon-cyan: #00f0ff;
      --neon-purple: #9d4edd;
      --neon-amber: #ffb703;
      --neon-red: #ff3366;
      --neon-grid: rgba(255, 42, 133, 0.12);
      --text-main: #f0e6ff;
      --text-muted: #8c7ba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        linear-gradient(to bottom, rgba(11, 8, 19, 0.90), rgba(11, 8, 19, 0.98)),
        linear-gradient(var(--neon-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--neon-grid) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      overflow: hidden;
    }

    header {
      border-bottom: 2px solid var(--panel-border);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20, 13, 36, 0.9);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .logo-group h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    .logo-group h1 span {
      color: var(--neon-pink);
      text-shadow: 0 0 10px rgba(255, 42, 133, 0.6);
    }

    .transport-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 8px 16px;
      border: 1px solid var(--neon-pink);
      background: rgba(255, 42, 133, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--neon-pink);
      box-shadow: 0 0 12px var(--neon-pink);
      color: #000;
    }

    .btn-cyan {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.1);
      text-shadow: 0 0 4px var(--neon-cyan);
    }

    .btn-cyan:hover {
      background: var(--neon-cyan);
      box-shadow: 0 0 12px var(--neon-cyan);
      color: #000;
    }

    .btn-stop {
      border-color: var(--neon-amber);
      background: rgba(255, 183, 3, 0.1);
    }

    .btn-stop:hover {
      background: var(--neon-amber);
      box-shadow: 0 0 12px var(--neon-amber);
      color: #000;
    }

    /* Main Workspace Layout */
    .studio-grid {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px 18px;
      gap: 12px;
      min-height: 0;
    }

    /* Upper 2/3 Section */
    .upper-workspace {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 12px;
      flex: 2;
      min-height: 0;
    }

    .left-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
      overflow-y: auto;
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--neon-pink);
      letter-spacing: 1.5px;
      border-bottom: 1px solid rgba(255, 42, 133, 0.25);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .ctrl-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      align-items: center;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ctrl-group label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .ctrl-group label span {
      color: var(--neon-cyan);
      font-weight: bold;
    }

    select, input[type="range"] {
      width: 100%;
      background: #0d0718;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 4px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 3px;
      background: #25183e;
      padding: 0;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    /* Chord & Drop Element Palette */
    .palette-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .draggable-card {
      background: rgba(42, 27, 78, 0.45);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      padding: 6px 12px;
      min-width: 90px;
      text-align: center;
      cursor: grab;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .draggable-card:hover {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.15);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.3);
      transform: translateY(-2px);
    }

    .draggable-card.drop-tool {
      border-color: var(--neon-amber);
      background: rgba(255, 183, 3, 0.1);
    }

    .draggable-card.drop-tool:hover {
      border-color: var(--neon-amber);
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .card-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--neon-cyan);
    }

    /* Section / Bar Builder Stack */
    .section-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-pills {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      background: #19102c;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill-btn.active {
      border-color: var(--neon-cyan);
      color: #000;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .bar-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-main);
    }

    .bar-stepper button {
      background: #25183e;
      border: 1px solid var(--panel-border);
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .section-slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      min-height: 80px;
      background: #0d0718;
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed #34245c;
    }

    .slot-cell {
      border: 1px dashed #483473;
      border-radius: 4px;
      padding: 8px 6px;
      text-align: center;
      background: rgba(20, 13, 36, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-height: 65px;
      position: relative;
    }

    .slot-cell.drag-over {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.2);
    }

    .slot-bar-idx {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .slot-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--neon-pink);
    }

    .slot-kick-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      color: var(--neon-amber);
      border: 1px solid var(--neon-amber);
      border-radius: 2px;
      padding: 1px 3px;
      position: absolute;
      bottom: 2px;
      right: 2px;
    }

    /* Lower 1/3 Full-Width Timeline */
    .lower-workspace {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .timeline-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-track {
      background: #090510;
      border: 1px dashed #34245c;
      border-radius: 4px;
      flex: 1;
      display: flex;
      gap: 8px;
      padding: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .song-block {
      background: linear-gradient(135deg, #241442, #180d2e);
      border: 1px solid var(--neon-purple);
      border-radius: 4px;
      padding: 8px 12px;
      min-width: 140px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .song-block.playing {
      border-color: var(--neon-pink);
      box-shadow: 0 0 14px rgba(255, 42, 133, 0.7);
      transform: scale(1.02);
    }

    .song-block .sec-tag {
      font-size: 0.65rem;
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-cyan);
    }

    .song-block .chord-lbl {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-block .del-btn {
      position: absolute;
      top: 3px;
      right: 6px;
      background: none;
      border: none;
      color: var(--neon-red);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .visualizer-strip {
      width: 100%;
      height: 38px;
      background: #06040a;
      border: 1px solid #20133c;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-group">
      <h1>SYNTHWAVE <span>STUDIO 84</span></h1>
    </div>
    <div class="transport-bar">
      <button class="btn btn-cyan" id="btn-play">▶ PLAY TRACK</button>
      <button class="btn btn-stop" id="btn-stop">■ STOP</button>
      <button class="btn" id="btn-export">💾 EXPORT WAV</button>
    </div>
  </header>

  <div class="studio-grid">
    
    <!-- UPPER 2/3 SPLIT -->
    <div class="upper-workspace">
      
      <!-- LEFT STACK (3/4 Width) -->
      <div class="left-stack">
        
        <!-- Harmonic Constraints & Drag Palette -->
        <div class="panel" style="flex: 1.1;">
          <div class="panel-title">1. HARMONIC CONSTRAINTS & TOOLBOX</div>
          
          <div class="ctrl-row">
            <div class="ctrl-group">
              <label>ROOT KEY</label>
              <select id="key-select">
                <option value="Am">A Minor (Outrun)</option>
                <option value="Cm">C Minor (Darksynth)</option>
                <option value="Dm">D Minor (Melancholy)</option>
                <option value="Em">E Minor (Cyber Chase)</option>
                <option value="Fm">F Minor (Noir / Slow)</option>
                <option value="Gm">G Minor (RetroWave)</option>
              </select>
            </div>
            <div class="ctrl-group">
              <label>TEMPO: <span id="bpm-val">110 BPM</span></label>
              <input type="range" id="bpm-slider" min="80" max="145" value="110" />
            </div>
            <div class="ctrl-group">
              <label>MAX TRACK TIME: <span id="dur-val">3.5 MIN</span></label>
              <input type="range" id="dur-slider" min="1.0" max="5.0" step="0.5" value="3.5" />
            </div>
          </div>

          <label style="font-family:'Share Tech Mono'; font-size:0.7rem; color:var(--text-muted); margin-top:4px;">
            DRAG CHORDS OR SPECIAL DROP TRIGGERS INTO THE BAR EDITOR SLOTS:
          </label>
          <div class="palette-container" id="drag-palette">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Section / Bar Length Editor -->
        <div class="panel" style="flex: 1.3;">
          <div class="section-nav-row">
            <div class="section-pills">
              <button class="pill-btn active" data-sec="Verse">VERSE</button>
              <button class="pill-btn" data-sec="Pre-Chorus">PRE-CHORUS</button>
              <button class="pill-btn" data-sec="Chorus">CHORUS</button>
              <button class="pill-btn" data-sec="Bridge">BRIDGE</button>
            </div>

            <div class="bar-stepper">
              <span>SECTION BARS:</span>
              <button id="btn-bar-dec">-</button>
              <span id="bar-count-disp" style="color:var(--neon-cyan); font-weight:bold; width:16px; text-align:center;">4</span>
              <button id="btn-bar-inc">+</button>
            </div>

            <button class="btn btn-cyan" id="btn-add-timeline">+ APPEND TO TIMELINE</button>
          </div>

          <div class="section-slots-grid" id="bar-slots-container">
            <!-- Slot drop targets injected dynamically -->
          </div>
        </div>

      </div>

      <!-- RIGHT PANEL: Synth Engine & 80s FX (1/4 Width) -->
      <div class="panel">
        <div class="panel-title">2. SYNTH & ANALOG FX</div>

        <div class="ctrl-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="color:#fff;">16th ARPEGGIATOR</label>
            <input type="checkbox" id="arp-toggle" checked style="width:auto; cursor:pointer;" />
          </div>
          <select id="arp-pattern" style="margin-top:4px;">
            <option value="up">Arp: Up (Classic)</option>
            <option value="updown">Arp: Up / Down</option>
            <option value="pulse16">Arp: 16th Octave Bass</option>
          </select>
        </div>

        <div class="ctrl-group">
          <label>CUTOFF: <span id="cutoff-val">2000 HZ</span></label>
          <input type="range" id="cutoff-slider" min="200" max="8000" value="2000" />
        </div>

        <div class="ctrl-group">
          <label>RESONANCE: <span id="res-val">4.5</span></label>
          <input type="range" id="res-slider" min="0.5" max="14" step="0.5" value="4.5" />
        </div>

        <div class="ctrl-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="color:#fff;">80s REVERB</label>
            <input type="checkbox" id="reverb-toggle" checked style="width:auto; cursor:pointer;" />
          </div>
          <input type="range" id="reverb-mix" min="0" max="1" step="0.05" value="0.4" />
        </div>

        <div class="ctrl-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="color:#fff;">ECHO DELAY</label>
            <input type="checkbox" id="delay-toggle" checked style="width:auto; cursor:pointer;" />
          </div>
          <input type="range" id="delay-mix" min="0" max="1" step="0.05" value="0.3" />
        </div>
      </div>

    </div>

    <!-- LOWER 1/3: Full Width Song Timeline -->
    <div class="lower-workspace">
      <div class="timeline-controls-bar">
        <div class="panel-title" style="border:none; padding:0;">3. FULL TRACK TIMELINE (ARRANGEMENT)</div>
        <div style="font-family:'Share Tech Mono'; color:var(--neon-amber); font-size:0.95rem;" id="time-disp">00:00 / 00:00</div>
      </div>

      <div class="song-track" id="main-timeline">
        <!-- Blocks appended here -->
      </div>

      <canvas class="visualizer-strip" id="scope"></canvas>
    </div>

  </div>

       DATA STRUCTURES & MUSIC LOGIC

    const NOTE_FREQS = {
      "C1": 32.70, "Db1": 34.65, "D1": 36.71, "Eb1": 38.89, "E1": 41.20, "F1": 43.65, "F#1": 46.25, "G1": 49.00, "Ab1": 51.91, "A1": 55.00, "Bb1": 58.27, "B1": 61.74,
      "C2": 65.41, "Db2": 69.30, "D2": 73.42, "Eb2": 77.78, "E2": 82.41, "F2": 87.31, "F#2": 92.50, "G2": 98.00, "Ab2": 103.83, "A2": 110.00, "Bb2": 116.54, "B2": 123.47,
      "C3": 130.81, "Db3": 138.59, "D3": 146.83, "Eb3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "G3": 196.00, "Ab3": 207.65, "A3": 220.00, "Bb3": 233.08, "B3": 246.94,
      "C4": 261.63, "Db4": 277.18, "D4": 293.66, "Eb4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00, "Ab4": 415.30, "A4": 440.00, "Bb4": 466.16, "B4": 493.88
    };

    /* State Store */
    let currentKey = "Am";
    let bpm = 110;
    let maxMinutes = 3.5;
    let activeSection = "Verse";

    // Section bar definitions: each bar holds { chord: string, hasKick: boolean }
    let sectionData = {
      "Verse": [
        { chord: "Am", hasKick: false },
        { chord: "F", hasKick: false },
        { chord: "C", hasKick: false },
        { chord: "G", hasKick: false }
      ],
      "Pre-Chorus": [
        { chord: "Dm", hasKick: false },
        { chord: "Em", hasKick: false },
        { chord: "F", hasKick: false },
        { chord: "G", hasKick: true }
      ],
      "Chorus": [
        { chord: "F", hasKick: true },
        { chord: "G", hasKick: true },
        { chord: "Am", hasKick: true },
        { chord: "Em", hasKick: true }
      ],
      "Bridge": [
        { chord: "Dm", hasKick: false },
        { chord: "SILENCE", hasKick: false },
        { chord: "F", hasKick: true },
        { chord: "G", hasKick: true }
      ]
    };

    let songTimeline = [
      { id: 1, section: "Verse", bars: JSON.parse(JSON.stringify(sectionData["Verse"])) },
      { id: 2, section: "Pre-Chorus", bars: JSON.parse(JSON.stringify(sectionData["Pre-Chorus"])) },
      { id: 3, section: "Chorus", bars: JSON.parse(JSON.stringify(sectionData["Chorus"])) }
    ];

    let isPlaying = false;
    let audioCtx = null;
    let playbackInterval = null;
    let analyserNode = null;

    /* ==========================================================================
       SYNTHESIS ENGINE (Web Audio API)
       ========================================================================== */
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;
        analyserNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function createReverbBuffer(ctx) {
      let len = ctx.sampleRate * 2.0;
      let buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        let ch = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          ch[i] = ((Math.random() * 2) - 1) * Math.pow(1 - (i / len), 2.2);
        }
      }
      return buf;
    }

    // Heavy Analog Drop Kick
    function triggerDropKick(time, ctx = audioCtx, dest = analyserNode) {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();

      osc.frequency.setValueAtTime(140, time);
      osc.frequency.exponentialRampToValueAtTime(32, time + 0.12);

      gain.gain.setValueAtTime(1.0, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

      osc.connect(gain);
      gain.connect(dest);

      osc.start(time);
      osc.stop(time + 0.36);
    }

    // Play 16th-note synth step
    function playSynthStep(barItem, sixteenthIdx, time, ctx = audioCtx, dest = analyserNode) {
      if (!barItem || barItem.chord === "SILENCE") return;

      let chordObj = KEY_DATA[currentKey].chords.find(c => c.name === barItem.chord);
      if (!chordObj) return;

      // Trigger heavy kick at beat 1 (sixteenth 0) if enabled
      if (sixteenthIdx === 0 && barItem.hasKick) {
        triggerDropKick(time, ctx, dest);
      }

      let cutoff = parseFloat(document.getElementById('cutoff-slider').value);
      let res = parseFloat(document.getElementById('res-slider').value);
      let arpOn = document.getElementById('arp-toggle').checked;
      let arpMode = document.getElementById('arp-pattern').value;

      let bus = ctx.createGain();
      bus.gain.setValueAtTime(0.65, time);

      let filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(cutoff, time);
      filter.Q.setValueAtTime(res, time);

      // Bass Osc
      let bassOsc = ctx.createOscillator();
      let bassGain = ctx.createGain();
      bassOsc.type = "sawtooth";
      let baseFreq = NOTE_FREQS[chordObj.bass] || 55;
      bassOsc.frequency.setValueAtTime((sixteenthIdx % 2 === 1) ? baseFreq * 2 : baseFreq, time);

      bassGain.gain.setValueAtTime(0.001, time);
      bassGain.gain.exponentialRampToValueAtTime(0.32, time + 0.01);
      bassGain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

      bassOsc.connect(filter);
      bassGain.connect(filter);
      bassOsc.connect(bassGain);
      bassOsc.start(time);
      bassOsc.stop(time + 0.14);

      // Lead / Arp
      if (arpOn) {
        let notes = chordObj.notes;
        let nIdx = 0;
        if (arpMode === "up") nIdx = sixteenthIdx % notes.length;
        else if (arpMode === "updown") {
          let s = [0, 1, 2, 3, 2, 1];
          nIdx = s[sixteenthIdx % s.length] % notes.length;
        } else {
          nIdx = (sixteenthIdx % 4 === 0) ? 0 : 2;
        }

        let leadFreq = NOTE_FREQS[notes[nIdx]] || 220;
        let lOsc1 = ctx.createOscillator();
        let lOsc2 = ctx.createOscillator();
        let lGain = ctx.createGain();

        lOsc1.type = "sawtooth";
        lOsc2.type = "square";
        lOsc1.frequency.setValueAtTime(leadFreq, time);
        lOsc2.frequency.setValueAtTime(leadFreq * 1.006, time);

        lGain.gain.setValueAtTime(0.001, time);
        lGain.gain.exponentialRampToValueAtTime(0.18, time + 0.02);
        lGain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);

        lOsc1.connect(lGain);
        lOsc2.connect(lGain);
        lGain.connect(filter);

        lOsc1.start(time);
        lOsc2.start(time);
        lOsc1.stop(time + 0.2);
        lOsc2.stop(time + 0.2);
      }

      filter.connect(bus);

      if (document.getElementById('reverb-toggle').checked) {
        let conv = ctx.createConvolver();
        conv.buffer = createReverbBuffer(ctx);
        let rGain = ctx.createGain();
        rGain.gain.value = parseFloat(document.getElementById('reverb-mix').value);
        bus.connect(conv);
        conv.connect(rGain);
        rGain.connect(dest);
      }

      if (document.getElementById('delay-toggle').checked) {
        let del = ctx.createDelay();
        del.delayTime.value = (60 / bpm) * 0.75;
        let fb = ctx.createGain();
        fb.gain.value = 0.35;
        let dMix = ctx.createGain();
        dMix.gain.value = parseFloat(document.getElementById('delay-mix').value);
        bus.connect(del);
        del.connect(fb);
        fb.connect(del);
        del.connect(dMix);
        dMix.connect(dest);
      }

      bus.connect(dest);
    }

    /* ==========================================================================
       DRAG & DROP PALETTE & SLOTS
       ========================================================================== */
    const dragPalette = document.getElementById('drag-palette');
    const barSlotsContainer = document.getElementById('bar-slots-container');
    const barCountDisp = document.getElementById('bar-count-disp');

    function renderDragPalette() {
      dragPalette.innerHTML = '';
      let keyChords = KEY_DATA[currentKey].chords;

      // 1. Regular Chords
      keyChords.forEach(c => {
        let card = document.createElement('div');
        card.className = 'draggable-card';
        card.draggable = true;
        card.innerHTML = `
          <div class="card-title">${c.name}</div>
          <div class="card-sub">${c.role}</div>
        `;
        card.ondragstart = (e) => {
          e.dataTransfer.setData("type", "chord");
          e.dataTransfer.setData("value", c.name);
        };
        dragPalette.appendChild(card);
      });

      // 2. Drop / Silence Tool
      let silenceCard = document.createElement('div');
      silenceCard.className = 'draggable-card drop-tool';
      silenceCard.draggable = true;
      silenceCard.innerHTML = `
        <div class="card-title" style="color:var(--neon-amber);">[ SILENCE ]</div>
        <div class="card-sub">Mute / Drop Bar</div>
      `;
      silenceCard.ondragstart = (e) => {
        e.dataTransfer.setData("type", "chord");
        e.dataTransfer.setData("value", "SILENCE");
      };
      dragPalette.appendChild(silenceCard);

      // 3. Drop Heavy Kick Tool
      let kickCard = document.createElement('div');
      kickCard.className = 'draggable-card drop-tool';
      kickCard.draggable = true;
      kickCard.innerHTML = `
        <div class="card-title" style="color:var(--neon-amber);">+ DROP KICK</div>
        <div class="card-sub">Downbeat Punch</div>
      `;
      kickCard.ondragstart = (e) => {
        e.dataTransfer.setData("type", "kick");
        e.dataTransfer.setData("value", "true");
      };
      dragPalette.appendChild(kickCard);
    }

    function renderBarSlots() {
      let currentBars = sectionData[activeSection];
      barCountDisp.textContent = currentBars.length;
      barSlotsContainer.innerHTML = '';

      currentBars.forEach((bar, idx) => {
        let slot = document.createElement('div');
        slot.className = 'slot-cell';
        slot.innerHTML = `
          <div class="slot-bar-idx">BAR ${idx + 1}</div>
          <div class="slot-val">${bar.chord}</div>
          ${bar.hasKick ? '<div class="slot-kick-badge">⚡ KICK</div>' : ''}
        `;

        slot.ondragover = (e) => {
          e.preventDefault();
          slot.classList.add('drag-over');
        };

        slot.ondragleave = () => slot.classList.remove('drag-over');

        slot.ondrop = (e) => {
          e.preventDefault();
          slot.classList.remove('drag-over');
          let type = e.dataTransfer.getData("type");
          let val = e.dataTransfer.getData("value");

          if (type === "chord") {
            sectionData[activeSection][idx].chord = val;
          } else if (type === "kick") {
            // Toggle kick
            sectionData[activeSection][idx].hasKick = !sectionData[activeSection][idx].hasKick;
          }
          renderBarSlots();
        };

        barSlotsContainer.appendChild(slot);
      });
    }

    /* Bar Length Controls */
    document.getElementById('btn-bar-inc').onclick = () => {
      if (sectionData[activeSection].length < 16) {
        let defaultChord = KEY_DATA[currentKey].chords[0].name;
        sectionData[activeSection].push({ chord: defaultChord, hasKick: false });
        renderBarSlots();
      }
    };

    document.getElementById('btn-bar-dec').onclick = () => {
      if (sectionData[activeSection].length > 1) {
        sectionData[activeSection].pop();
        renderBarSlots();
      }
    };

    /* Section Pills */
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeSection = btn.getAttribute('data-sec');
        renderBarSlots();
      };
    });

    /* ==========================================================================
       TIMELINE ARRANGEMENT
       ========================================================================== */
    const mainTimeline = document.getElementById('main-timeline');
    const timeDisp = document.getElementById('time-disp');

    function renderTimeline() {
      mainTimeline.innerHTML = '';
      let totalSeconds = 0;
      let barSecs = (60 / bpm) * 4;

      songTimeline.forEach((item, idx) => {
        totalSeconds += barSecs * item.bars.length;
        let chordNames = item.bars.map(b => b.chord === "SILENCE" ? "[MUTE]" : b.chord).join(' • ');

        let block = document.createElement('div');
        block.className = 'song-block';
        block.id = `block-${idx}`;
        block.innerHTML = `
          <button class="del-btn">&times;</button>
          <div class="sec-tag">${item.section} (${item.bars.length} BARS)</div>
          <div class="chord-lbl">${chordNames}</div>
        `;

        block.querySelector('.del-btn').onclick = (e) => {
          e.stopPropagation();
          songTimeline.splice(idx, 1);
          renderTimeline();
        };

        mainTimeline.appendChild(block);
      });

      let m = Math.floor(totalSeconds / 60);
      let s = Math.floor(totalSeconds % 60);
      timeDisp.textContent = `00:00 / ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    document.getElementById('btn-add-timeline').onclick = () => {
      let maxSecs = maxMinutes * 60;
      let barSecs = (60 / bpm) * 4;
      let currentTotalSecs = songTimeline.reduce((acc, curr) => acc + (curr.bars.length * barSecs), 0);
      let addingSecs = sectionData[activeSection].length * barSecs;

      if (currentTotalSecs + addingSecs > maxSecs) {
        alert("Maximum song length reached based on your song duration setting!");
        return;
      }

      songTimeline.push({
        id: Date.now(),
        section: activeSection,
        bars: JSON.parse(JSON.stringify(sectionData[activeSection]))
      });
      renderTimeline();
    };

    /* Key & Global Control Listeners */
    document.getElementById('key-select').onchange = (e) => {
      currentKey = e.target.value;
      let validChords = KEY_DATA[currentKey].chords.map(c => c.name);
      // Remap presets
      sectionData["Verse"].forEach((b, i) => b.chord = validChords[i % validChords.length]);
      sectionData["Pre-Chorus"].forEach((b, i) => b.chord = validChords[(i + 2) % validChords.length]);
      sectionData["Chorus"].forEach((b, i) => b.chord = validChords[(i + 1) % validChords.length]);
      sectionData["Bridge"].forEach((b, i) => b.chord = (i === 1) ? "SILENCE" : validChords[(i + 4) % validChords.length]);

      renderDragPalette();
      renderBarSlots();
      renderTimeline();
    };

    document.getElementById('bpm-slider').oninput = (e) => {
      bpm = parseInt(e.target.value);
      document.getElementById('bpm-val').textContent = `${bpm} BPM`;
      renderTimeline();
    };

    document.getElementById('dur-slider').oninput = (e) => {
      maxMinutes = parseFloat(e.target.value);
      document.getElementById('dur-val').textContent = `${maxMinutes.toFixed(1)} MIN`;
    };

    document.getElementById('cutoff-slider').oninput = (e) => {
      document.getElementById('cutoff-val').textContent = `${e.target.value} HZ`;
    };

    document.getElementById('res-slider').oninput = (e) => {
      document.getElementById('res-val').textContent = e.target.value;
    };

    /* ==========================================================================
       PLAYBACK SEQUENCER
       ========================================================================== */
    function stopAudio() {
      isPlaying = false;
      if (playbackInterval) clearInterval(playbackInterval);
      document.querySelectorAll('.song-block').forEach(b => b.classList.remove('playing'));
      document.getElementById('btn-play').textContent = "▶ PLAY TRACK";
    }

    function startAudio() {
      if (songTimeline.length === 0) return;
      initAudio();
      isPlaying = true;
      document.getElementById('btn-play').textContent = "❚❚ PAUSE";

      // Flatten timeline into bar units
      let flattenedBars = [];
      let blockIndices = [];
      songTimeline.forEach((item, bIdx) => {
        item.bars.forEach(bar => {
          flattenedBars.push(bar);
          blockIndices.push(bIdx);
        });
      });

      let step16thTime = (60 / bpm) / 4;
      let totalSteps = flattenedBars.length * 16;
      let currentStep = 0;

      playbackInterval = setInterval(() => {
        if (!isPlaying) return;

        let barIdx = Math.floor(currentStep / 16);
        let sixteenth = currentStep % 16;
        let currentBlock = blockIndices[barIdx];

        document.querySelectorAll('.song-block').forEach((b, i) => {
          if (i === currentBlock) b.classList.add('playing');
          else b.classList.remove('playing');
        });

        playSynthStep(flattenedBars[barIdx], sixteenth, audioCtx.currentTime);

        let elapsed = currentStep * step16thTime;
        let m = Math.floor(elapsed / 60);
        let s = Math.floor(elapsed % 60);
        timeDisp.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} / ${timeDisp.textContent.split(' / ')[1]}`;

        currentStep++;
        if (currentStep >= totalSteps) stopAudio();
      }, step16thTime * 1000);
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) stopAudio();
      else startAudio();
    };

    document.getElementById('btn-stop').onclick = stopAudio;

    /* ==========================================================================
       OFFLINE WAV EXPORT
       ========================================================================== */
    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function bufferToWave(buffer) {
      let numOfChan = buffer.numberOfChannels;
      let length = buffer.length * numOfChan * 2 + 44;
      let out = new DataView(new ArrayBuffer(length));
      let pos = 0;

      writeString(out, pos, 'RIFF'); pos += 4;
      out.setUint32(pos, length - 8, true); pos += 4;
      writeString(out, pos, 'WAVE'); pos += 4;
      writeString(out, pos, 'fmt '); pos += 4;
      out.setUint32(pos, 16, true); pos += 4;
      out.setUint16(pos, 1, true); pos += 2;
      out.setUint16(pos, numOfChan, true); pos += 2;
      out.setUint32(pos, buffer.sampleRate, true); pos += 4;
      out.setUint32(pos, buffer.sampleRate * 2 * numOfChan, true); pos += 4;
      out.setUint16(pos, numOfChan * 2, true); pos += 2;
      out.setUint16(pos, 16, true); pos += 2;
      writeString(out, pos, 'data'); pos += 4;
      out.setUint32(pos, length - pos - 4, true); pos += 4;

      let channels = [];
      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      let offset = 0;
      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    document.getElementById('btn-export').onclick = async () => {
      if (songTimeline.length === 0) {
        alert("Please append at least one section before exporting!");
        return;
      }
      stopAudio();
      const exportBtn = document.getElementById('btn-export');
      exportBtn.textContent = "⏳ RENDERING...";

      let flattenedBars = [];
      songTimeline.forEach(item => {
        item.bars.forEach(bar => flattenedBars.push(bar));
      });

      let step16thTime = (60 / bpm) / 4;
      let totalDuration = (flattenedBars.length * 16 * step16thTime) + 2.5;
      let sampleRate = 44100;
      let offlineCtx = new OfflineAudioContext(2, sampleRate * totalDuration, sampleRate);

      for (let i = 0; i < flattenedBars.length * 16; i++) {
        let bIdx = Math.floor(i / 16);
        let sixteenth = i % 16;
        let scheduleTime = i * step16thTime;
        playSynthStep(flattenedBars[bIdx], sixteenth, scheduleTime, offlineCtx, offlineCtx.destination);
      }

      let buffer = await offlineCtx.startRendering();
      let wav = bufferToWave(buffer);
      let a = document.createElement('a');
      a.href = URL.createObjectURL(wav);
      a.download = `synthwave_${currentKey}_${bpm}bpm.wav`;
      a.click();

      exportBtn.textContent = "💾 EXPORT WAV";
    };

    /* ==========================================================================
       OSCILLOSCOPE
       ========================================================================== */
    const canvas = document.getElementById('scope');
    const ctxC = canvas.getContext('2d');

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyserNode) return;

      let len = analyserNode.frequencyBinCount;
      let data = new Uint8Array(len);
      analyserNode.getByteTimeDomainData(data);

      ctxC.fillStyle = '#06040a';
      ctxC.fillRect(0, 0, canvas.width, canvas.height);
      ctxC.lineWidth = 1.5;
      ctxC.strokeStyle = '#00f0ff';

      ctxC.beginPath();
      let slice = canvas.width / len;
      let x = 0;

      for (let i = 0; i < len; i++) {
        let v = data[i] / 128.0;
        let y = v * (canvas.height / 2);
        if (i === 0) ctxC.moveTo(x, y);
        else ctxC.lineTo(x, y);
        x += slice;
      }
      ctxC.lineTo(canvas.width, canvas.height / 2);
      ctxC.stroke();
    }

    // Init
    renderDragPalette();
    renderBarSlots();
    renderTimeline();
    drawVisualizer();
  </script>
</body>
</html>
